services:
  mariadb:
    image: mariadb:11
    container_name: sigmas-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: sigmas
      MARIADB_USER: sigmas_user
      MARIADB_PASSWORD: sigmas_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
